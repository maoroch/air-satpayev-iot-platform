services:
  postgres:
    image: postgres:16-alpine
    container_name: purifier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Satpayev2026SecurePass
      POSTGRES_DB: purifier_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: purifier-redis
    restart: unless-stopped
    expose:
      - "6379"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: purifier-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purifier-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:Satpayev2026SecurePass@postgres:5432/purifier_db
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-satpayev-wind-2026-very-secure-jwt-key
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  device_adapter:
    build:
      context: ./device_adapter
      dockerfile: Dockerfile
    container_name: purifier-device-adapter
    restart: unless-stopped
    depends_on:
      - mosquitto
      - backend
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      BACKEND_API_URL: http://backend:8000/api/v1/telemetry/ingest

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: purifier-simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
      - backend
    environment:
      DEVICE_ID: purifier-satpayev-01
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      BACKEND_API_URL: http://backend:8000/api/v1/telemetry/ingest
      SEND_INTERVAL_SEC: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: purifier-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:3000"
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}

volumes:
  postgres_data:
  mosquitto_data:
